<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">V2I occlusion concept diagram</title>
  <desc id="desc">An infrastructure sensor detects a pedestrian hidden from an autonomous vehicle by a parked vehicle and sends the information through V2I.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#245a73"/>
    </marker>
    <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#6a747e"/>
    </marker>
    <pattern id="occlusion" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c5ccd2" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="42" y="86" width="876" height="366" rx="4" fill="#f2f4f5" stroke="#cfd6dc"/>
  <rect x="42" y="86" width="876" height="74" fill="#e7ebed"/>
  <line x1="42" y1="160" x2="918" y2="160" stroke="#b7c0c7" stroke-width="2"/>
  <line x1="72" y1="330" x2="888" y2="330" stroke="#ffffff" stroke-width="4" stroke-dasharray="30 22"/>
  <text x="66" y="126" fill="#5d6772" font-family="Arial, sans-serif" font-size="15">SIDEWALK</text>

  <g aria-label="Autonomous Vehicle">
    <rect x="112" y="356" width="172" height="72" rx="12" fill="#ffffff" stroke="#245a73" stroke-width="3"/>
    <rect x="152" y="370" width="82" height="44" rx="5" fill="#dce9ee" stroke="#245a73"/>
    <circle cx="145" cy="430" r="11" fill="#35414b"/>
    <circle cx="250" cy="430" r="11" fill="#35414b"/>
    <path d="M285 392H330" stroke="#6a747e" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <circle cx="285" cy="392" r="5" fill="#245a73"/>
    <text x="112" y="478" fill="#18212b" font-family="Arial, sans-serif" font-size="17" font-weight="600">Autonomous Vehicle</text>
    <text x="112" y="500" fill="#5d6772" font-family="Arial, sans-serif" font-size="14">Vehicle Sensor</text>
  </g>

  <g aria-label="Parked vehicle">
    <rect x="478" y="176" width="174" height="76" rx="12" fill="#ffffff" stroke="#68737d" stroke-width="2"/>
    <rect x="515" y="189" width="94" height="48" rx="5" fill="#e5e9ec" stroke="#8b949c"/>
    <circle cx="512" cy="254" r="11" fill="#35414b"/>
    <circle cx="620" cy="254" r="11" fill="#35414b"/>
    <text x="498" y="148" fill="#18212b" font-family="Arial, sans-serif" font-size="16">Parked Vehicle</text>
  </g>

  <path d="M290 392L478 252L710 286L290 392Z" fill="url(#occlusion)" opacity="0.72"/>
  <path d="M290 392L478 252" fill="none" stroke="#8b949c" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M290 392L710 286" fill="none" stroke="#8b949c" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="386" y="367" fill="#5d6772" font-family="Arial, sans-serif" font-size="14">Limited visibility / occlusion</text>

  <g aria-label="Pedestrian hidden behind parked vehicle">
    <circle cx="694" cy="277" r="12" fill="#d78b43"/>
    <path d="M694 291V326M694 301L677 316M694 301L712 314M694 326L680 349M694 326L710 349" fill="none" stroke="#9b5d25" stroke-width="6" stroke-linecap="round"/>
    <text x="650" y="378" fill="#18212b" font-family="Arial, sans-serif" font-size="16">Pedestrian</text>
    <text x="650" y="399" fill="#5d6772" font-family="Arial, sans-serif" font-size="14">hidden from vehicle</text>
  </g>

  <g aria-label="Infrastructure Sensor">
    <rect x="778" y="104" width="18" height="92" rx="3" fill="#4d5963"/>
    <rect x="753" y="92" width="68" height="34" rx="5" fill="#ffffff" stroke="#245a73" stroke-width="2"/>
    <circle cx="787" cy="109" r="8" fill="#245a73"/>
    <path d="M778 196L738 281M796 196L720 284" fill="none" stroke="#245a73" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="716" y="62" fill="#18212b" font-family="Arial, sans-serif" font-size="17" font-weight="600">Infrastructure Sensor</text>
  </g>

  <path d="M754 120C650 28 356 34 252 344" fill="none" stroke="#245a73" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="416" y="40" width="160" height="30" rx="15" fill="#eaf2f5" stroke="#b8ced8"/>
  <text x="442" y="61" fill="#245a73" font-family="Arial, sans-serif" font-size="15" font-weight="600">V2I Information</text>
</svg>
