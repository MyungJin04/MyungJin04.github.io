<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual reconstruction of observed bus failure</title>
  <desc id="desc">A diagonal bus occupies a wide road area. A single avoidance path still enters the occupied area, and no additional replanning occurs.</desc>
  <defs>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a35c42"/></marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <g font-family="Inter, Noto Sans KR, Arial, sans-serif">
    <text x="45" y="48" fill="#18212b" font-size="23" font-weight="600">Large obstacle — insufficient replanning</text>
    <rect x="130" y="75" width="700" height="370" fill="#e6eaed" stroke="#c6ced4"/>
    <rect x="130" y="75" width="75" height="370" fill="#f4f1ec"/>
    <rect x="755" y="75" width="75" height="370" fill="#f4f1ec"/>
    <line x1="388" y1="75" x2="388" y2="445" stroke="#ffffff" stroke-width="4" stroke-dasharray="22 18"/>
    <line x1="572" y1="75" x2="572" y2="445" stroke="#ffffff" stroke-width="4" stroke-dasharray="22 18"/>
    <text x="160" y="105" fill="#8c857a" font-size="13" text-anchor="middle">sidewalk</text>
    <text x="795" y="105" fill="#8c857a" font-size="13" text-anchor="middle">sidewalk</text>
    <g transform="translate(495 205) rotate(-24)">
      <rect x="-125" y="-40" width="250" height="80" rx="12" fill="#59646c" stroke="#18212b" stroke-width="2"/>
      <rect x="-92" y="-25" width="42" height="50" rx="3" fill="#c8d7de"/>
      <rect x="-38" y="-25" width="42" height="50" rx="3" fill="#c8d7de"/>
      <rect x="16" y="-25" width="42" height="50" rx="3" fill="#c8d7de"/>
      <rect x="70" y="-25" width="35" height="50" rx="3" fill="#c8d7de"/>
      <text x="0" y="65" fill="#18212b" font-size="15" font-weight="600" text-anchor="middle" transform="rotate(24)">wide occupied area</text>
    </g>
    <g transform="translate(300 385)">
      <rect x="-25" y="-43" width="50" height="86" rx="9" fill="#245a73"/>
      <rect x="-17" y="-25" width="34" height="25" rx="3" fill="#bfd0d8"/>
      <text x="0" y="66" fill="#18212b" font-size="14" font-weight="600" text-anchor="middle">ego vehicle</text>
    </g>
    <path d="M300 340 C305 300 350 275 405 255 C448 240 474 230 510 214" fill="none" stroke="#a35c42" stroke-width="5" stroke-dasharray="11 8" marker-end="url(#red-arrow)"/>
    <circle cx="510" cy="214" r="18" fill="#f7e9e4" stroke="#a35c42" stroke-width="3"/>
    <path d="M501 205L519 223M519 205L501 223" stroke="#a35c42" stroke-width="3"/>
    <text x="642" y="353" fill="#8b4d37" font-size="16" font-weight="600">Single avoidance candidate</text>
    <text x="642" y="378" fill="#5d6772" font-size="14">Path remains inside bus area</text>
    <text x="642" y="402" fill="#5d6772" font-size="14">No additional replanning</text>
  </g>
</svg>
