<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Rule-based control pipeline</title>
  <desc id="desc">Camera and LiDAR feed obstacle perception, tracking and classification, behavior selection, and vehicle control.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#245a73"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="45" y="55" fill="#18212b" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="25" font-weight="600">Rule-based control pipeline</text>
  <text x="45" y="83" fill="#5d6772" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="15">Perception and tracked motion state determine the driving action.</text>
  <g font-family="Inter, Noto Sans KR, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(45 130)">
      <rect width="150" height="100" rx="7" fill="#f5f7f8" stroke="#dce2e7"/>
      <text x="75" y="39" fill="#18212b" font-size="18" font-weight="600">Camera</text>
      <text x="75" y="66" fill="#5d6772" font-size="16">LiDAR</text>
    </g>
    <g transform="translate(225 130)">
      <rect width="150" height="100" rx="7" fill="#eaf2f5" stroke="#b9ccd5"/>
      <text x="75" y="40" fill="#18212b" font-size="17" font-weight="600">Obstacle</text>
      <text x="75" y="66" fill="#18212b" font-size="17" font-weight="600">Perception</text>
    </g>
    <g transform="translate(405 130)">
      <rect width="150" height="100" rx="7" fill="#eaf2f5" stroke="#b9ccd5"/>
      <text x="75" y="39" fill="#18212b" font-size="16" font-weight="600">Tracking &amp;</text>
      <text x="75" y="66" fill="#18212b" font-size="16" font-weight="600">Classification</text>
    </g>
    <g transform="translate(585 130)">
      <rect width="150" height="100" rx="7" fill="#f5f7f8" stroke="#dce2e7"/>
      <text x="75" y="31" fill="#18212b" font-size="16" font-weight="600">Lattice</text>
      <text x="75" y="55" fill="#18212b" font-size="16" font-weight="600">Follow</text>
      <text x="75" y="79" fill="#18212b" font-size="16" font-weight="600">Stop</text>
    </g>
    <g transform="translate(765 130)">
      <rect width="150" height="100" rx="7" fill="#245a73" stroke="#245a73"/>
      <text x="75" y="40" fill="#ffffff" font-size="17" font-weight="600">Vehicle</text>
      <text x="75" y="67" fill="#ffffff" font-size="17" font-weight="600">Control</text>
    </g>
  </g>
  <g stroke="#245a73" stroke-width="2" marker-end="url(#arrow)">
    <path d="M195 180 H215"/><path d="M375 180 H395"/><path d="M555 180 H575"/><path d="M735 180 H755"/>
  </g>
  <text x="480" y="292" fill="#5d6772" font-family="Inter, Noto Sans KR, Arial, sans-serif" font-size="15" text-anchor="middle">STATIC · SLOW_MOVING_IN_LANE · CUT_IN/CROSSING · OTHER_LANE_MOVING</text>
</svg>
